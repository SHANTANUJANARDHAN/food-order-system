<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Foods</title>
    <link rel="stylesheet" href="../public/css/font-awesome/font-awesome.css">
    <link rel="stylesheet" href="../public/css/hover-min.css">
    <link rel="stylesheet" href="../public/css/style.css">
</head>

<body>
    <header class="navbar">
        <nav id="site-top-nav" class="navbar-menu navbar-fixed-top">
            <div class="container">
                <div class="logo">
                    <a href="index.html" title="Logo">
                        <img src="../public/img/logo.png" alt="Logo" class="img-responsive">
                    </a>
                </div>
                <div class="menu text-right">
                    <ul>
                        <li><a class="hvr-underline-from-center" href="index.html">Home</a></li>
                        <li><a class="hvr-underline-from-center" href="categories.html">Categories</a></li>
                        <li><a class="hvr-underline-from-center" href="order.html">Order</a></li>
                        <li><a class="hvr-underline-from-center" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <section class="foods">
        <div class="container">
            <h2 class="text-center">Available Foods</h2>
            <div id="food-list" class="food-list">
                <!-- Food items will be dynamically inserted here -->
            </div>
        </div>
    </section>

    <footer class="footer">
        <div class="container">
            <p>All rights reserved. Design By <a href="#">Code Arcade</a></p>
        </div>
    </footer>

    <script src="https://code.jquery.com/jquery-3.6.0.js"></script>
    <script>
        $(document).ready(function () {
            $.ajax({
                url: '/api/foods', // Endpoint to fetch food items
                method: 'GET',
                success: function (data) {
                    const foodList = $('#food-list');
                    data.forEach(food => {
                        foodList.append(`
                            <div class="food-item">
                                <img src="../public/img/food/${food.image}" alt="${food.name}">
                                <h3>${food.name}</h3>
                                <p>Price: $${food.price.toFixed(2)}</p>
                                <button class="btn-order" data-id="${food.id}">Order Now</button>
                            </div>
                        `);
                    });
                },
                error: function (error) {
                    console.error("Error fetching food items:", error);
                }
            });

            $(document).on('click', '.btn-order', function () {
                const foodId = $(this).data('id');
                window.location.href = `order.html?foodId=${foodId}`;
            });
        });
    </script>
</body>

</html>
