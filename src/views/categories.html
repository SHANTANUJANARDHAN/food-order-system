<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Food Categories</h2>
        <div class="row">
            <!-- Pizza Category -->
            <div class="col-md-4">
                <div class="card">
                    <img src="../img/food/p1.jpg" class="card-img-top" alt="Pizza">
                    <div class="card-body">
                        <h5 class="card-title">Pizza</h5>
                        <p class="card-text">Delicious cheesy pizza with fresh toppings.</p>
                        <a href="order.html?item=Pizza" class="btn btn-primary">Order Now</a>
                    </div>
                </div>
            </div>

            <!-- Burger Category -->
            <div class="col-md-4">
                <div class="card">
                    <img src="../img/food/b1.jpg" class="card-img-top" alt="Burger">
                    <div class="card-body">
                        <h5 class="card-title">Burger</h5>
                        <p class="card-text">Juicy burgers with fresh ingredients.</p>
                        <a href="order.html?item=Burger" class="btn btn-primary">Order Now</a>
                    </div>
                </div>
            </div>

            <!-- Pasta Category -->
            <div class="col-md-4">
                <div class="card">
                    <img src="../img/food/s1.jpg" class="card-img-top" alt="Pasta">
                    <div class="card-body">
                        <h5 class="card-title">Pasta</h5>
                        <p class="card-text">Creamy pasta with authentic Italian flavors.</p>
                        <a href="order.html?item=Pasta" class="btn btn-primary">Order Now</a>
                    </div>
                </div>
            </div>

            <!-- Drinks Category -->
            <div class="col-md-4 mt-4">
                <div class="card">
                    <img src="https://c8.alamy.com/comp/DH8N1X/bottles-of-hard-liquor-whiskey-rum-vodka-DH8N1X.jpg" class="card-img-top" alt="Drinks">
                    <div class="card-body">
                        <h5 class="card-title">Drinks</h5>
                        <p class="card-text">Refreshing beverages to complement your meal.</p>
                        <a href="order.html?item=Drinks" class="btn btn-primary">Order Now</a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
