<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Food</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <!-- Navbar -->
    <header class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="../img/logo.png" alt="Logo" class="img-fluid" style="height: 50px;">
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="categories.html">Categories</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    <li class="nav-item"><button class="btn btn-outline-primary" data-bs-toggle="offcanvas"
                            data-bs-target="#orderHistoryCanvas" aria-controls="orderHistoryCanvas">My Orders</button>
                    </li>
                </ul>
            </div>
        </div>
    </header>

    <!-- Order Section -->
    <section class="order py-5">
        <div class="container">
            <h2 class="text-center mb-4">Order Your Favorite Food</h2>
            <form id="order-form">
                <div class="row">
                    <!-- Food Selection -->
                    <div class="col-md-6">
                        <div class="mb-3">
                            <label for="food-item" class="form-label">Select Food Item</label>
                            <select id="food-item" class="form-select" required>
                                <option value="" disabled>Select a food item</option>
                                <option value="Pizza" data-price="200">Pizza - ₹200</option>
                                <option value="Burger" data-price="150">Burger - ₹150</option>
                                <option value="Pasta" data-price="180">Pasta - ₹180</option>
                                <option value="Drinks" data-price="50">Drinks - ₹50</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="quantity" class="form-label">Quantity</label>
                            <input type="number" id="quantity" class="form-control" min="1" value="1" required>
                        </div>
                        <button type="button" id="add-to-cart" class="btn btn-primary">Add to Cart</button>
                    </div>

                    <!-- Delivery Details -->
                    <div class="col-md-6">
                        <h5>Delivery Details</h5>
                        <div class="mb-3">
                            <label for="full-name" class="form-label">Full Name</label>
                            <input type="text" id="full-name" class="form-control" placeholder="Enter your name"
                                required>
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="form-label">Phone Number</label>
                            <input type="text" id="phone" class="form-control" placeholder="Enter your phone" required>
                        </div>
                        <div class="mb-3">
                            <label for="address" class="form-label">Address</label>
                            <textarea id="address" class="form-control" rows="3" placeholder="Enter your address"
                                required></textarea>
                        </div>
                        <button type="submit" class="btn btn-success">Place Order</button>
                    </div>
                </div>
            </form>
        </div>
    </section>

    <!-- Cart Section -->
    <section class="cart py-5 bg-light">
        <div class="container">
            <h2 class="text-center mb-4">Your Cart</h2>
            <table class="table table-bordered" id="cart-table">
                <thead>
                    <tr>
                        <th>Food Item</th>
                        <th>Price</th>
                        <th>Quantity</th>
                        <th>Total</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Cart items will be dynamically added here -->
                </tbody>
                <tfoot>
                    <tr>
                        <th colspan="3" class="text-end">Grand Total</th>
                        <th id="grand-total">₹0.00</th>
                        <th></th>
                    </tr>
                </tfoot>
            </table>
        </div>
    </section>

    <!-- Offcanvas for Order History -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="orderHistoryCanvas"
        aria-labelledby="orderHistoryCanvasLabel" style="width: 80%;">
        <div class="offcanvas-header">
            <h5 id="orderHistoryCanvasLabel">My Orders</h5>
            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
        </div>
        <div class="offcanvas-body">
            <table class="table table-bordered" id="order-history-table">
                <thead>
                    <tr>
                        <th>Order ID</th>
                        <th>Payment ID</th>
                        <th>Food Item</th>
                        <th>Quantity</th>
                        <th>Total</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Order history will be dynamically added here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Razorpay Script -->
    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const cart = [];
            const cartTableBody = document.querySelector('#cart-table tbody');
            const grandTotalElement = document.getElementById('grand-total');
            const orderHistoryTableBody = document.querySelector('#order-history-table tbody');

            // Pre-select food item based on URL query parameter
            const urlParams = new URLSearchParams(window.location.search);
            const selectedItem = urlParams.get('item');
            if (selectedItem) {
                const foodItemSelect = document.getElementById('food-item');
                for (const option of foodItemSelect.options) {
                    if (option.value === selectedItem) {
                        option.selected = true;
                        break;
                    }
                }
            }

            // Add to Cart
            document.getElementById('add-to-cart').addEventListener('click', () => {
                const foodItemSelect = document.getElementById('food-item');
                const selectedOption = foodItemSelect.options[foodItemSelect.selectedIndex];
                const foodName = selectedOption.value;
                const price = parseFloat(selectedOption.getAttribute('data-price'));
                const quantity = parseInt(document.getElementById('quantity').value);

                if (!foodName || isNaN(price) || isNaN(quantity) || quantity <= 0) {
                    alert('Please select a valid food item and quantity.');
                    return;
                }

                const total = price * quantity;
                cart.push({ foodName, price, quantity, total });

                // Update Cart Table
                const row = document.createElement('tr');
                row.innerHTML = `
                    <td>${foodName}</td>
                    <td>₹${price.toFixed(2)}</td>
                    <td>${quantity}</td>
                    <td>₹${total.toFixed(2)}</td>
                    <td><button class="btn btn-danger btn-sm remove-item">Remove</button></td>
                `;
                cartTableBody.appendChild(row);

                updateGrandTotal();

                // Remove Item from Cart
                row.querySelector('.remove-item').addEventListener('click', () => {
                    const index = cart.indexOf(cart.find(item => item.foodName === foodName && item.quantity === quantity));
                    if (index > -1) cart.splice(index, 1);
                    row.remove();
                    updateGrandTotal();
                });
            });

            // Update Grand Total
            function updateGrandTotal() {
                const grandTotal = cart.reduce((sum, item) => sum + item.total, 0);
                grandTotalElement.textContent = `₹${grandTotal.toFixed(2)}`;
            }

            // Place Order
            document.getElementById('order-form').addEventListener('submit', async (e) => {
                e.preventDefault();

                if (cart.length === 0) {
                    alert('Your cart is empty. Please add items to your cart.');
                    return;
                }

                const fullName = document.getElementById('full-name').value;
                const phone = document.getElementById('phone').value;
                const address = document.getElementById('address').value;

                const grandTotal = cart.reduce((sum, item) => sum + item.total, 0);

                // Create Razorpay Order
                const response = await fetch('/api/payments/create-order', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ amount: grandTotal, currency: 'INR' })
                });
                const order = await response.json();

                // Razorpay Payment
                const options = {
                    key: 'rzp_test_maTowvalNvA422', // Replace with your Razorpay Key ID
                    amount: order.amount,
                    currency: order.currency,
                    name: 'Food Delivery',
                    description: 'Order Payment',
                    order_id: order.id,
                    handler: async function (response) {
                        alert('Payment successful!');

                        // Verify payment and save order details
                        await fetch('/api/payments/verify-payment', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                paymentId: response.razorpay_payment_id,
                                orderId: response.razorpay_order_id,
                                signature: response.razorpay_signature,
                                fullName,
                                amount: grandTotal,
                                currency: 'INR',
                                phone,
                                address,
                                cart
                            })
                        });

                        alert('Order placed successfully!');
                        cart.length = 0; // Clear cart
                        cartTableBody.innerHTML = ''; // Clear table
                        updateGrandTotal();
                        document.getElementById('order-form').reset();
                    },
                    prefill: {
                        name: fullName,
                        contact: phone
                    }
                };

                const razorpay = new Razorpay(options);
                razorpay.open();
            });

            // Fetch Order History
            document.querySelector('[data-bs-target="#orderHistoryCanvas"]').addEventListener('click', async () => {
                const phone = document.getElementById('phone').value;

                if (!phone) {
                    alert('Please enter your phone number to view order history.');
                    return;
                }

                const response = await fetch(`/api/payments/orders/${phone}`);
                const orders = await response.json();

                // Clear existing rows
                orderHistoryTableBody.innerHTML = '';

                // Group orders by order_id
                const groupedOrders = orders.reduce((acc, order) => {
                    if (!acc[order.order_id]) {
                        acc[order.order_id] = {
                            payment_id: order.payment_id,
                            created_at: order.created_at,
                            items: []
                        };
                    }
                    acc[order.order_id].items.push({
                        food_name: order.food_name,
                        quantity: order.quantity,
                        total: order.total
                    });
                    return acc;
                }, {});

                // Populate order history
                Object.keys(groupedOrders).forEach(orderId => {
                    const order = groupedOrders[orderId];
                    const row = document.createElement('tr');
                    row.innerHTML = `
            <td rowspan="${order.items.length}">${orderId}</td>
            <td rowspan="${order.items.length}">${order.payment_id}</td>
            <td>${order.items[0].food_name}</td>
            <td>${order.items[0].quantity}</td>
            <td>₹${order.items[0].total}</td>
        `;
                    orderHistoryTableBody.appendChild(row);

                    // Add additional rows for other items in the same order
                    for (let i = 1; i < order.items.length; i++) {
                        const itemRow = document.createElement('tr');
                        itemRow.innerHTML = `
                <td>${order.items[i].food_name}</td>
                <td>${order.items[i].quantity}</td>
                <td>₹${order.items[i].total}</td>
            `;
                        orderHistoryTableBody.appendChild(itemRow);
                    }
                });
            });
        });
    </script>
</body>

</html>
